name: Reusable CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: Test@123
          MYSQL_DATABASE: bankappdb

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pTest@123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # -----------------------------------
      # Checkout
      # -----------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------------
      # Java Setup
      # -----------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # -----------------------------------
      # Compile
      # -----------------------------------
      - name: Compile
        run: mvn compile


      # -----------------------------------
      # Testing
      # -----------------------------------
      - name: Testing
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/bankappdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: Test@123

        run: mvn test


      # -----------------------------------
      # Package
      # Creates target/*.jar
      # -----------------------------------
      - name: Package Application
        run: mvn package -DskipTests


      # -----------------------------------
      # Verify JAR
      # -----------------------------------
      - name: Check JAR
        run: |
          echo "Generated Maven artifact:"
          ls -lah target/


      # -----------------------------------
      # Docker Buildx
      # -----------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -----------------------------------
      # DockerHub Login
      # -----------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # -----------------------------------
      # Build + Push Docker Image
      # -----------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-app-image:${{ github.run_id }}